name = "solid-crm"
main = "src/server/worker.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
# Only the custom domains (behind Cloudflare Access) serve the app; no public *.workers.dev URL.
workers_dev = false
routes = [
  { pattern = "crm.solidlandscapeinc.com", custom_domain = true },
  { pattern = "go.solidlandscapeinc.com", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "solid-crm-db"
database_id = "<your-d1-database-id>"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "solid-crm-files"

[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[triggers]
crons = ["0 12 * * *"] # 7 am EST / 8 am EDT

[vars]
APP_URL = "https://crm.solidlandscapeinc.com"
QR_BASE = "https://go.solidlandscapeinc.com"

# Secrets (wrangler secret put …): TELEGRAM_TOKEN, TELEGRAM_CHAT_ID, NETLIFY_JWS_SECRET, EMAIL_INTAKE_KEY,
# ACCESS_TEAM_DOMAIN, ACCESS_AUD, OWNER_EMAILS. Custom domains are added at deploy (see README).
